site_name: DisSModel Platform
site_description: Run DisSModel executors as queued jobs and keep a record of each run.
repo_url: https://github.com/DisSModel/dissmodel-platform
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - content.code.copy

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - ExperimentRecord: experiment-record.md
  - Model registry: registry.md
  - Executors: executors.md
  - Input and output data: data.md
  - API reference: api-reference.md
  - Security: security.md
  - Deployment: deployment.md
  - Reports:
    - Installation on Windows (2026): reports/installation-windows-2026.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - toc:
      permalink: true
