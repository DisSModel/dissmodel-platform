name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Lint
        run: ruff check services/api/ services/worker/ scripts/


  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install mypy
          pip install -r services/api/requirements.txt
          pip install -r services/worker/requirements.txt
      - name: Run Mypy
        run: |
          # Focamos apenas na lógica da API e Worker da plataforma
          PYTHONPATH=$PWD/services mypy --ignore-missing-imports services/api/main.py services/worker/worker.py services/worker/runner.py services/worker/job_runner.py services/worker/compare.py


  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r services/api/ services/worker/ -ll -ii -f txt -o bandit-report.txt

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt


  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r services/api/requirements.txt
          pip install -r requirements-test.txt

      # In-memory Redis (fakeredis); MinIO is not contacted.
      - name: Run API Tests
        run: pytest services/api/tests


  test-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r services/worker/requirements.txt
          pip install -r requirements-test.txt

      # Runs the real job subprocess with a temporary registry and a local output root.
      - name: Run Worker Tests
        run: PYTHONPATH=$PWD/services pytest services/worker/tests

      - name: Validate executor contracts
        run: PYTHONPATH=$PWD/services python3 scripts/validate_executors.py


  build-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker
        uses: docker/build-push-action@v5
        with:
          context: ./services/worker
          file: ./services/worker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Jupyter
        uses: docker/build-push-action@v5
        with:
          context: ./services/jupyter
          file: ./services/jupyter/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
